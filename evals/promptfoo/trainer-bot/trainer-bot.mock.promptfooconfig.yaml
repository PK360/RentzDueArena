description: Rentz Arena trainer bot promptfoo mock evals
prompts:
  - file://../shared/default-routing-prompt.txt
providers:
  - id: file://../providers/trainer-bot.provider.js
    label: trainer-bot
commandLineOptions:
  tableCellMaxLength: 120
tests: file://cases.yaml
defaultTest:
  assert:
    - type: javascript
      value: file://assertions.js:isValidJsonOutput
    - type: javascript
      value: file://assertions.js:trainerModeContract
    - type: javascript
      value: file://assertions.js:trainerSourceExpectation
    - type: javascript
      value: file://assertions.js:trainerRatingInRange
    - type: javascript
      value: file://assertions.js:trainerDoesNotLeakHiddenCards
    - type: javascript
      value: file://assertions.js:outputDoesNotContainChainOfThought
    - type: javascript
      value: file://assertions.js:trainerLengthScore
    - type: javascript
      value: file://assertions.js:trainerConstructiveToneScore
    - type: javascript
      value: file://assertions.js:trainerRecommendationExpectation
    - type: javascript
      value: file://assertions.js:trainerFinalReviewNoNumericScore
