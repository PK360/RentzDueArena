    scenarioId: trainer-real-before-visible
    evaluationType: contract
    mode: before_move
    rulesetId: kingOfHearts
    trainerElo: 2800
    trainerHand: '["2-clubs", "K-hearts", "A-spades"]'
    legalMoves: '["2-clubs", "K-hearts"]'
