- description: Trainer fast final review summarizes the session without repeating the star score in text
  vars:
    scenarioId: trainer-fast-final-review
    evaluationType: quality
    mode: final_review
    selectedRulesetLabel: King of Hearts
    totalRounds: 2
    feedbackEntries: '[{"roundNumber":1,"rating":8.8,"feedback":"Move rating: 8.8/10. Good choice. It fits the current objective and keeps the position manageable."},{"roundNumber":2,"rating":4.2,"feedback":"Move rating: 4.2/10. This was a riskier choice for the current ruleset. A safer choice would have been 2-clubs."}]'
