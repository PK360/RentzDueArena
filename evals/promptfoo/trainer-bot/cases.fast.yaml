- description: Trainer fast contract returns concise pre-move commentary without exposing hidden cards
  vars:
    scenarioId: trainer-fast-before-visible
    evaluationType: contract
    mode: before_move
    rulesetId: kingOfHearts
    trainerElo: 2800
    trainerHand: '["2-clubs", "K-hearts", "A-spades"]'
    legalMoves: '["2-clubs", "K-hearts"]'
    selectedMoveId: 2-clubs
    currentTrick: '[{"playedBy":"player-2","playerName":"Opponent","card":"A-hearts"}]'
    expectedAllowedSources: '["llm","llm-repaired"]'
    timeoutMs: 10000
    maxLength: 120
    maxElapsedMs: 10000
    forbiddenHiddenStrings: '["A-spades"]'

