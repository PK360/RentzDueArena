- description: Gameplay real contract returns one legal move in a simple king-of-hearts spot
  vars:
    scenarioId: gameplay-real-simple-legal
    evaluationType: contract
    kind: play_card
    rulesetId: kingOfHearts
    humanElos: '[900, 1100, 1000]'
    botHand: '["2-hearts", "9-hearts"]'
    legalMoves: '["2-hearts", "9-hearts"]'
    expectedSource: llm
    maxElapsedMs: 120000

- description: Gameplay real contract handles a forced penalty card without falling back
  vars:
    scenarioId: gameplay-real-forced-penalty
    evaluationType: contract
    kind: play_card
    rulesetId: kingOfHearts
    humanElos: '[1800, 1900, 1700]'
    botHand: '["K-hearts"]'
    legalMoves: '["K-hearts"]'
    expectedMoveId: K-hearts
    expectedSource: forced
    maxElapsedMs: 1000

- description: Gameplay real contract remains structured and legal in a six-player context
  vars:
    scenarioId: gameplay-real-six-player-validity
    evaluationType: contract
    useSixPlayerFixture: true
    kind: play_card
    rulesetId: whist
    humanElos: '[1400, 1500, 1600, 1700, 1800]'
    botHand: '["4-clubs", "9-hearts"]'
    legalMoves: '["4-clubs", "9-hearts"]'
    expectedSource: llm
    maxElapsedMs: 120000

- description: Gameplay real quality avoids the obvious king-of-hearts penalty when a safe club is legal
  vars:
