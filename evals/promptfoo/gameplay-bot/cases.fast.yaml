- description: Gameplay fast contract returns one legal move in a simple king-of-hearts spot
  vars:
    scenarioId: gameplay-fast-simple-legal
    evaluationType: contract
    kind: play_card
    rulesetId: kingOfHearts
    humanElos: '[900, 1100, 1000]'
    botHand: '["2-hearts", "9-hearts"]'
    legalMoves: '["2-hearts", "9-hearts"]'
    expectedSource: llm
    maxElapsedMs: 15000

