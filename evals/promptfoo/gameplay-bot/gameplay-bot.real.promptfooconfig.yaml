description: Rentz Arena gameplay bot promptfoo real Ollama evals
prompts:
  - file://prompts/current.txt
providers:
  - id: file://../providers/gameplay-bot.provider.js
    label: gameplay-bot
evaluateOptions:
  maxConcurrency: 1
commandLineOptions:
  tableCellMaxLength: 120
tests: file://cases.real.yaml
defaultTest:
  assert:
    - type: javascript
      value: file://assertions.js:isValidJsonOutput
    - type: javascript
      value: file://assertions.js:moveIdExists
    - type: javascript
      value: file://assertions.js:gameplayMoveIsLegal
    - type: javascript
      value: file://assertions.js:gameplayDoesNotInventCard
    - type: javascript
      value: file://assertions.js:gameplayConfidenceInRange
    - type: javascript
      value: file://assertions.js:outputDoesNotContainChainOfThought
    - type: javascript
      value: file://assertions.js:gameplayDifficultyExpectation
    - type: javascript
      value: file://assertions.js:gameplayReasonScore
    - type: javascript
      value: file://assertions.js:gameplayLatencyScore
    - type: javascript
      value: file://assertions.js:gameplaySourceExpectation
