- description: Editor Bot sanitizer removes category labels and score contamination from explanations
  vars:
    caseId: editor-contaminated-output
    evaluationType: contract
    executionMode: synthetic-cloud-fixture
    mockScenario: contaminated-cloud
    rulesetFixture: default-king-of-hearts.rentz
    rulesetTitle: Contaminated Output Sample
    rulesetShortName: COS
    expectedAllowedReviewSources: '["cloud"]'
    expectedSuccess: true
    expectedProviderModes: '["synthetic-cloud-fixture"]'
    expectedSourceHash: dbc1a362b5515fae
    expectedMinCategoryScores: '{"claritySimplicity": 8}'
    expectedKeywords: '["king of hearts"]'

- description: Empty response plus hidden thinking becomes a fallback classification instead of fake cloud success
  vars:
    caseId: editor-budget-exhausted-fallback
    evaluationType: fallback
    executionMode: synthetic-fallback
    mockScenario: empty-thinking-fallback
    rulesetFixture: default-king-of-hearts.rentz
    rulesetTitle: Budget Exhaustion Fallback
    rulesetShortName: TBE
    expectedAllowedReviewSources: '["fallback"]'
    expectedUsedFallback: true
    expectedSuccess: false
    expectedProviderModes: '["synthetic-fallback"]'
    expectedSourceHash: dbc1a362b5515fae
    requiredWarningTerms: '["fallback"]'

- description: Editor Bot does not pretend a broken ruleset compiled successfully
  vars:
    caseId: editor-broken-ruleset
    evaluationType: compiler-error
    executionMode: compiler-error
    rulesetTitle: Broken Ruleset
    rulesetShortName: BRK
    rulesetCode: "if(HEART_KING)\n  add(-100)\n"
    compilerStatus: error
    compilerMessage: "Unexpected end of ruleset: missing endif."
    compilerErrors: '["Unexpected end of ruleset: missing endif."]'
    expectedAllowedReviewSources: '["error"]'
    expectedUsedFallback: true
    expectedSuccess: false
    expectedProviderModes: '["compiler-error"]'
    expectedSourceHash: 6349f52484534fbf
    expectedMaxOverallScore: 1
    requiredWarningTerms: '["compiler"]'
    expectedKeywords: '["compile", "compiler", "endif", "fix"]'

