- description: Editor Bot does not pretend a broken ruleset compiled successfully
  vars:
    caseId: editor-broken-ruleset
    executionMode: compiler-error
    rulesetTitle: Broken Ruleset
    rulesetShortName: BRK
    rulesetCode: "if(HEART_KING)\n  add(-100)\n"
    compilerStatus: error
    compilerMessage: "Unexpected end of ruleset: missing endif."
    compilerErrors: '["Unexpected end of ruleset: missing endif."]'
    expectedAllowedReviewSources: '["error"]'
    expectedUsedFallback: true
    expectedSuccess: false
    expectedSourceHash: 6349f52484534fbf
    expectedMaxOverallScore: 1
    requiredWarningTerms: '["compiler"]'
    expectedKeywords: '["compile", "compiler", "endif", "fix"]'

