- description: Editor Bot rates a simple focused king-of-hearts contract as clear and specific
  vars:
    caseId: editor-simple-heart-threat
    executionMode: cloud
    mockScenario: simple-good-cloud
    rulesetFixture: simple-good-ruleset.rentz
    rulesetTitle: Simple Heart Threat
    rulesetShortName: SHT
    expectedAllowedReviewSources: '["cloud", "cloud-repaired"]'
    expectedSuccess: true
    expectedSourceHash: 10195fa94fbf035f
    expectedMinOverallScore: 7.5
    expectedScoreTolerance: 0.5
    expectedMinCategoryScores: '{"claritySimplicity": 8.5}'
    expectedKeywords: '["king of hearts", "heart", "danger card"]'

- description: Editor Bot warns that instant-ending king-of-hearts rules feel abrupt and harsher
  vars:
    caseId: editor-king-of-hearts-ender
    executionMode: cloud
    mockScenario: king-end-cloud
    rulesetFixture: default-king-of-hearts.rentz
    rulesetTitle: King of Hearts Ender
    rulesetShortName: KHE
    expectedAllowedReviewSources: '["cloud", "cloud-repaired"]'
    expectedSuccess: true
    expectedSourceHash: dbc1a362b5515fae
    expectedScoreTolerance: 0.5
    expectedMinCategoryScores: '{"claritySimplicity": 8}'
    expectedMaxCategoryScores: '{"comebackPotential": 7.5, "playerAgency": 8.5}'
    requiredConcernTermsAny: '["abrupt", "harsh", "punitive"]'
    expectedKeywords: '["king of hearts", "ends the round", "game_end", "ending"]'

